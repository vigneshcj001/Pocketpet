<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketPet</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="games.css" />
    <link rel="stylesheet" href="droplet.css" />
    <link rel="stylesheet" href="companion.css" />
  </head>
  <body>
    <!-- The whole page is a transparent, click-through overlay covering every
         monitor. Only the pet and its bubble are interactive, and the Rust side
         flips click-through on and off as the cursor enters/leaves them. -->
    <div id="stage">
      <div id="pet" class="pet">
        <div id="bubble" class="bubble" hidden><span id="bubble-text"></span></div>
        <div id="sprite" class="sprite"></div>
        <!-- Emoji accessories in slots (hat, face, neck, back, paw). -->
        <div id="accessories" class="accessories"></div>
        <!-- Fullness bar; hidden unless the setting is on. -->
        <div id="hunger" class="hunger" hidden><div id="hunger-fill" class="hunger-fill"></div></div>
      </div>
      <div id="companion" class="companion" hidden>
        <button type="button" id="companion-launcher" class="companion-launcher" title="Show companion controls" aria-label="Show companion controls" aria-expanded="false" aria-controls="companion-panel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
          <span id="companion-badge" class="companion-badge" aria-hidden="true" hidden></span>
        </button>
        <span id="companion-status" class="companion-status" role="status" aria-live="polite" aria-atomic="true"></span>
        <div id="companion-panel" class="companion-panel" hidden>
          <div id="companion-controls" class="companion-controls" role="group" aria-label="Companion controls"></div>
          <button type="button" id="companion-task" class="companion-task" hidden title="Open task details">
            <strong id="companion-title"></strong>
            <span id="companion-summary" role="status" aria-live="polite"></span>
          </button>
        </div>
      </div>
      <!-- "break in 12:34" pill; positioned above the pet each frame. -->
      <div id="countdown" class="countdown" hidden></div>
      <div id="shadow" class="shadow"></div>
      <!-- Optional second pet. Click-through; it just tags along. -->
      <div id="buddy" class="pet buddy" hidden>
        <div id="buddy-sprite" class="sprite"></div>
        <div id="buddy-accessories" class="accessories"></div>
      </div>
      <!-- Food the user placed; the pet runs over and eats it. -->
      <div id="food" class="food" hidden></div>
      <!-- Ball for fetch. Same click-to-place mechanic as food. -->
      <div id="ball" class="ball" hidden>⚽</div>
      <!-- Floating hearts from petting; children are transient. -->
      <div id="hearts" class="hearts"></div>
      <!-- Drawn over a caption button while the pet is pressing it. -->
      <div id="target-ring" class="target-ring" hidden></div>

      <!-- Inline chat bar: pen trigger ➜ pill input ➜ Enter sends task -->
      <button
        type="button"
        id="chat-trigger"
        class="chat-trigger"
        title="Ask me something"
        aria-label="Open inline chat"
        hidden
      >
        <!-- pen / edit icon -->
        <svg viewBox="0 0 20 20" width="13" height="13" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M14.5 2.5a2.121 2.121 0 0 1 3 3L6 17l-4 1 1-4 11.5-11.5z"/>
        </svg>
      </button>

      <div id="chat-bar" class="chat-bar" hidden role="search" aria-label="Ask the pet">
        <!-- chevron/collapse -->
        <button type="button" id="chat-chevron" class="chat-icon-btn"
                title="Collapse" aria-label="Close chat bar">
          <svg viewBox="0 0 20 20" width="12" height="12" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <polyline points="4 8 10 14 16 8"/>
          </svg>
        </button>

        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="Start new chat"
          autocomplete="off"
          spellcheck="false"
          aria-label="Type a prompt for the pet"
        />

        <!-- submit / send -->
        <button type="button" id="chat-send" class="chat-icon-btn chat-send-btn"
                title="Send (Enter)" aria-label="Send prompt">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"
               aria-hidden="true">
            <circle cx="10" cy="10" r="9"/>
            <path d="M7 10l3-3 3 3M10 7v6" stroke="white" stroke-width="1.8"
                  stroke-linecap="round" fill="none"/>
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
