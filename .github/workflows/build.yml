name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# softprops/action-gh-release needs to write the release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS tests
        run: node --test tests/features.test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: nsis
            artifact: src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-13
            name: macos-x64
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            bundles: appimage,deb
            artifact: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
      - name: Linux packages (webkit, tray, X11 for the cursor poller, dbus for the keyring)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libx11-dev libxtst-dev libdbus-1-dev libgtk-3-dev
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        run: cargo tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
