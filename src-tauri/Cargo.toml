[package]
name = "pocketpet"
version = "0.1.0"
description = "PocketPet - desktop pet that follows your cursor and clicks your window buttons"
authors = ["vigneshcj001"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pocketpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio-tungstenite = "0.26"
tauri-plugin-window-state = "2"
futures-util = "0.3"
regex-lite = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tauri-plugin-notification = "2"

# macOS / Linux: what Win32 gave us for free comes from crates instead.
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-global-shortcut = "2"
device_query = "2"
rfd = "0.15"
arboard = { version = "3", default-features = false }
auto-launch = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_UI_Controls_Dialogs",
  "Win32_Security_Credentials",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Media_SpeechRecognition",
  "Foundation",
  "Foundation_Collections",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
